const nav = document.getElementById("subjects");
const detail = document.getElementById("detail");

function kac(s){ const d=document.createElement("div"); d.textContent=s; return d.innerHTML; }

function dersSec(id){
  const ders = dersler.find(d => d.id === id);
  if(!ders) return;

  nav.style.display = "none";
  detail.className = "fade";
  detail.style.setProperty("--c", ders.renk);

  if(ders.tip === "pdf"){
    let html = '<button type="button" class="back-btn" id="geriDon">← Derslere Dön</button>';
    html += '<div style="margin-bottom:20px"><h2 style="color:'+ders.renk+';font-size:1.6rem;">'+ders.ikon+' '+ders.ad+' Sınav Rehberi</h2><p style="color:var(--muted)">Tüm konular tek sayfada çalışma notu formatında</p></div>';
    html += '<div class="pdf-container">';
    
    ders.konular.forEach(k => {
      let gorselHtml = k.gorsel ? '<img src="'+k.gorsel+'" alt="Konu Görseli">' : '';
      html += 
        '<div class="topic-card" style="border-left-color:'+ders.renk+'">'+
          '<h2 style="color:'+ders.renk+'">'+k.baslik+'</h2>'+
          '<div class="content-body">'+
            '<p>'+k.aciklama+'</p>'+
            gorselHtml+
          '</div>'+
        '</div>';
    });
    
    html += '</div>';
    detail.innerHTML = html;
  } else {
    detail.innerHTML = 
      '<button type="button" class="back-btn" id="geriDon">← Derslere Dön</button>'+
      '<div class="empty-view"><h2>'+ders.ikon+' '+ders.ad+'</h2><p style="margin-top:8px">Bu ders için henüz içerik eklenmedi.</p></div>';
  }

  document.getElementById("geriDon").addEventListener("click", () => {
    nav.style.display = "grid";
    detail.innerHTML = "";
    history.replaceState(null,"","#");
  });

  history.replaceState(null,"","#"+id);
}

dersler.forEach(d => {
  const b = document.createElement("button");
  b.type = "button";
  b.className = "subject";
  b.style.setProperty("--c", d.renk);
  b.innerHTML = '<span class="icon">'+d.ikon+'</span><span class="name">'+kac(d.ad)+'</span>';
  b.addEventListener("click", () => dersSec(d.id));
  nav.appendChild(b);
});
</script>
